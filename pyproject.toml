[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alpaca-hackathon-paper-system"
version = "0.1.0"
description = "Paper-only, replayable options-agent architecture."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alpaca-py>=0.42,<1",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "uvicorn>=0.41,<0.42",
  "pyarrow>=22,<23",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16,<0.17",
]

[project.scripts]
paper-api = "apps.api.main:run"
paper-agent-worker = "apps.agent_worker.main:main"
paper-decision-worker = "apps.decision_worker.main:main"
paper-execution-worker = "apps.execution_worker.main:main"
paper-operator = "apps.operator_cli.main:main"
schema-export = "packages.contracts.schema_export:main"
research-data-collect = "packages.research_data.cli:main"
research-data-feasibility = "packages.research_data.cli:feasibility_main"
research-data-collect-options = "packages.research_data.cli:options_main"
research-data-collect-stage = "packages.research_data.cli:stage_main"
research-data-finalize = "packages.research_data.cli:finalize_main"
research-data-group-a-option-requests = "packages.research_data.cli:group_a_option_requests_main"
research-data-group-a-sensitivity-option-requests = "packages.research_data.cli:group_a_sensitivity_option_requests_main"
research-data-group-a-parallel-v2-option-requests = "packages.research_data.cli:group_a_parallel_v2_option_requests_main"
research-data-group-a-wheel-v12-option-requests = "packages.research_data.cli:group_a_wheel_v12_option_requests_main"
research-data-collect-options-stage = "packages.research_data.cli:option_stage_main"
research-data-finalize-options = "packages.research_data.cli:option_finalize_main"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages", "strategy_plugins"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"packages/strategy_runner/child.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages", "strategy_plugins"]
