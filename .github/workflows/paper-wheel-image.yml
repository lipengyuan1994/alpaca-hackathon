name: paper-wheel-image

on:
  pull_request:
    paths:
      - "configs/paper/v13_5_qqq.yaml"
      - "infra/paper-wheel/**"
      - "packages/contracts/**"
      - "packages/paper_wheel/**"
      - "packages/runtime_secrets.py"
      - ".github/workflows/paper-wheel-image.yml"
  push:
    branches: [main]
    paths:
      - "configs/paper/v13_5_qqq.yaml"
      - "infra/paper-wheel/**"
      - "packages/contracts/**"
      - "packages/paper_wheel/**"
      - "packages/runtime_secrets.py"
      - ".github/workflows/paper-wheel-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: paper-wheel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/paper-wheel/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/lipengyuan1994/alpaca-hackathon-paper-wheel:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record published digest
        if: github.event_name != 'pull_request'
        run: echo 'Image digest `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
