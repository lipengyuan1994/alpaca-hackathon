schema_version: paper-wheel-config/v3

runtime:
  mode: paper
  paper_base_url: https://paper-api.alpaca.markets
  submission_enabled: true
  runtime_root: artifacts/paper_wheel/v13_5_qqq_market_hours_cash_secured
  client_order_prefix: rs-v135

strategy:
  strategy_id: v13.5
  symbols: [QQQ]
  minimum_dte: 7
  maximum_dte: 14
  trend_sessions: 50
  uptrend_put_otm_fraction: 0.01
  uptrend_call_otm_fraction: 0.03
  downtrend_put_otm_fraction: 0.03
  downtrend_call_otm_fraction: 0.01
  take_profit_fraction: 0.15

schedule:
  timezone: America/New_York
  entry_policy: market_hours
  no_new_entries_after: "15:15"
  poll_seconds: 60
  order_cancel_after_seconds: 180
  cancel_confirmation_grace_seconds: 120
  lifecycle_settlement_grace_minutes: 30

risk:
  max_contracts_per_symbol: 1
  minimum_unreserved_cash_usd: 25000
  maximum_daily_drawdown_fraction: 0.02
  maximum_quote_age_seconds: 15
  maximum_clock_skew_seconds: 2
  maximum_relative_spread: 0.25
  minimum_option_bid: 0.05
  allowed_symbols: [QQQ]
  allow_unmanaged_positions: false
  allow_unmanaged_open_orders: false

activation:
  start_date: 2026-08-31
  end_date: 2026-09-04
  require_operator_arm: true
