          - heading "Near-live broker evidence" [level=3] [ref=e91]
          - paragraph [ref=e92]: Running since Tuesday, September 1, 2026. Cloudflare Durable Object alarms trigger broker snapshots every 30 minutes on weekdays, 9:00 AM–5:00 PM ET. Equity, P&L history, and filled V13.5 orders come from Alpaca paper—not a backtest.
