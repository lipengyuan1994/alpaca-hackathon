        - strong [ref=e123]: Refresh ≠ trading
        - paragraph [ref=e124]: The paper trading loop operates separately. This publishing pipeline reads results; it never starts trading, submits orders, or cancels them. Real-market paper evidence is observable performance—not a promise of future returns.
