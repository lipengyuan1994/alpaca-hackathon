name: paper-system-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Verify native runtime
        run: |
          test "$(uname -m)" = arm64
          uv --version
          uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Verify native Python
        run: uv run python -c 'import platform; assert platform.machine() == "arm64"'
      - name: Test architecture and fixture replay
        run: uv run python -m pytest
      - name: Test dashboard chart data
        run: |
          node -e 'if (process.arch !== "arm64") throw new Error("Native ARM64 Node required")'
          node --test tests/site/pnl_chart.test.cjs
      - name: Test Cloudflare paper refresh Worker
        run: |
          node -e 'if (process.arch !== "arm64") throw new Error("Native ARM64 Node required")'
          npm ci --prefix cloudflare/alpaca-paper-refresh-native
          npm test --prefix cloudflare/alpaca-paper-refresh-native
      - name: Verify schema snapshots
        run: |
          uv run python -m packages.contracts.schema_export
          git diff --exit-code -- schemas/v1
