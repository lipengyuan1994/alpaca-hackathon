        - heading "Real market conditions. Real strategy decisions. Results in the open." [level=2] [ref=e246]
      - generic [ref=e247]:
        - paragraph [ref=e248]: This is more than a hypothetical model output. Stable Income Generator runs on live market data, and its account values, portfolio history, and system fills are reported directly by Alpaca’s paper Trading API. The public record shows how the strategy performs as markets move—not just how it scored in a historical test.
        - paragraph [ref=e249]:
          - text: The trade table is restricted to filled orders with the system-owned
          - code [ref=e250]: rs-v135
          - text: client-order prefix. Credentials and order-control capabilities remain private. Paper execution and capital are simulated, so these results demonstrate live-market operation rather than live-money returns.
