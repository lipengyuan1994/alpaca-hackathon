schema_version: feature-contract/v1
candidate_id: intraday_continuation__all_feasible__o2_v1
source: alpaca_iex_1min_completed_v1
symbols: [SPY, QQQ, TQQQ, SMH, SOXL, IGV]
features:
  close_completed_15m_v1:
    type: decimal
    unit: price
    formula: completed ET half-open 15-minute interval close
    event_rule: interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
  momentum_z_60m_same_time_v1:
    type: decimal
    unit: z_score
    formula: (log(close_t/close_t_minus_60m)-mean_prior_20_same_time_r60)/max(sample_std_prior_20_same_time_r60,0.000001)
    source_feed: iex_split_adjusted
    event_rule: completed_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
  session_iex_vwap_v1:
    type: decimal
    unit: price
    formula: cumulative_sum(minute_vwap*minute_volume)/cumulative_sum(minute_volume)
    source_feed: iex_split_adjusted
    event_rule: completed_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
quality_flags: [FULL_XNYS_SESSION, IEX_COMPLETE, NO_DUPLICATE_BARS, OHLC_VALID]
