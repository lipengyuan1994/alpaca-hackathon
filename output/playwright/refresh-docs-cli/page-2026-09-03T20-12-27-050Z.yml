          - heading "Three proof layers. Never blended." [level=2] [ref=e76]: Three proof layers.Never blended.
        - paragraph [ref=e77]: A serious trading system should make it easy to see where every claim comes from. We separate historical research, deterministic system verification, and broker-reported paper behavior.
      - generic [ref=e78]:
        - article [ref=e79]:
          - generic [ref=e80]: 01 · BACKTEST
          - heading "Frozen and reproducible" [level=3] [ref=e81]
          - paragraph [ref=e82]: V13.5 was selected by a predeclared net-return rule from five QQQ wheel variants. The result is bound to immutable input and output hashes and independently reproduced byte for byte.
          - link "Inspect run manifest ↗" [ref=e83] [cursor=pointer]:
            - /url: https://github.com/lipengyuan1994/alpaca-hackathon/blob/main/research/candidates/group_a_wheel_v13_package_20260830/run_manifest.json
        - article [ref=e84]:
          - generic [ref=e85]: 02 · AUTOMATION
          - heading "Executing the lifecycle" [level=3] [ref=e86]
          - paragraph [ref=e87]: "The paper scheduler wakes every 60 seconds. Its hash-chained journal recorded five filled orders on September 1: three cash-secured put entries and two deterministic profit-taking closes."
          - link "Read the paper runbook ↗" [ref=e88] [cursor=pointer]:
            - /url: https://github.com/lipengyuan1994/alpaca-hackathon/blob/main/docs/deployment/PAPER_WHEEL_V13_5.md
