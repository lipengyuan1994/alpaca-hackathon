schema_version: feature-contract/v1
candidate_id: gap_continuation__all_feasible__o2_v1
source: alpaca_iex_1min_completed_v1
symbols: [SPY, QQQ, TQQQ, SMH, SOXL, IGV]
namespacing: <SYMBOL>__<feature_key>
key_order: symbols ordered [SPY, QQQ, TQQQ, SMH, SOXL, IGV], then lexicographic within symbol
features:
  close_completed_15m_v1:
    type: decimal
    unit: price
    formula: completed ET half-open 15-minute interval close at 10:30 (last one-minute close)
    source_feed: iex_split_adjusted
    event_rule: completed_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
  prior_regular_close_adjusted_v1:
    type: decimal
    unit: price
    formula: prior full regular session final close, split-adjusted continuous series
    lookback: 1 prior full regular session
    source_feed: iex_split_adjusted
    event_rule: prior_session_close
    availability_rule: session_open
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  prior_regular_close_raw_v1:
    type: decimal
    unit: price
    formula: raw unadjusted twin of prior_regular_close_adjusted_v1 for audit and option-strike joins
    lookback: 1 prior full regular session
    source_feed: iex_raw
    event_rule: prior_session_close
    availability_rule: session_open
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  open_0930_adjusted_v1:
    type: decimal
    unit: price
    formula: first one-minute bar open at 09:30 ET, split-adjusted
    source_feed: iex_split_adjusted
    event_rule: 09_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  open_0930_raw_v1:
    type: decimal
    unit: price
    formula: raw unadjusted twin of open_0930_adjusted_v1 for audit and option-strike joins
    source_feed: iex_raw
    event_rule: 09_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  gap_log_adjusted_v1:
    type: decimal
    unit: log_return
    formula: log(open_0930_adjusted/prior_regular_close_adjusted)
    source_feed: iex_split_adjusted
    event_rule: 09_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  sigma_gap_60_v1:
    type: decimal
    unit: log_return
    formula: sample_std(prior_60_full_session_gap_returns) with ddof=1
    lookback: 60 prior full sessions
    source_feed: iex_split_adjusted
    event_rule: prior_session_close
    availability_rule: session_open
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  gap_z_60_v1:
    type: decimal
    unit: z_score
    formula: gap_log_adjusted/max(sigma_gap_60, 0.000001)
    source_feed: iex_split_adjusted
    event_rule: 09_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  first_hour_return_v1:
    type: decimal
    unit: log_return
    formula: log(close_completed_15m_at_1030/open_0930_adjusted)
    source_feed: iex_split_adjusted
    event_rule: 10_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
  continuation_ratio_v1:
    type: decimal
    unit: ratio
    formula: sign(gap_log_adjusted)*first_hour_return/max(abs(gap_log_adjusted), 0.000001)
    source_feed: iex_split_adjusted
    event_rule: 10_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
  session_iex_vwap_v1:
    type: decimal
    unit: price
    formula: cumulative_sum(minute_vwap*minute_volume)/cumulative_sum(minute_volume)
    source_feed: iex_split_adjusted
    event_rule: 10_30_interval_end
    availability_rule: interval_end_plus_1_second
    maximum_age_seconds: 60
    missing_behavior: NO_TRADE
  early_close_session_v1:
    type: boolean
    unit: flag
    formula: current or prior session is an XNYS half day per the frozen market calendar
    source_feed: alpaca_market_calendar
    event_rule: session_open
    availability_rule: session_open
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  corporate_action_continuity_clear_v1:
    type: boolean
    unit: flag
    formula: no split/distribution with uncertain raw-price continuity affects the gap; ambiguity invalidates the session
    source_feed: alpaca_corporate_actions
    event_rule: session_open
    availability_rule: session_open
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
  adjustment_basis_v1:
    type: string
    unit: enum
    formula: adjustment basis of the price series, expected exactly split_adjusted
    source_feed: alpaca_stock_adjustment_setting
    event_rule: session_open
    availability_rule: session_open
    maximum_age_seconds: 23400
    missing_behavior: NO_TRADE
quality_flags: [FULL_XNYS_SESSION, PRIOR_SESSION_FULL, IEX_COMPLETE, NO_DUPLICATE_BARS, OHLC_VALID, CORPORATE_ACTION_CONTINUITY_CLEAR]
worked_examples:
  status: TO_BE_HASHED_WITH_GOLDEN_FIXTURES_BEFORE_OUTCOME_RUN
missing_policy: missing, stale, nonfinite, schema-mismatched, or adjustment-ambiguous features produce NO_TRADE
